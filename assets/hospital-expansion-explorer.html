<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Primary Care Expansion Explorer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
*{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;color:#374151;background:#f8fafc} .wrap{padding:22px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:16px}.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:#64748b;font-weight:700}.title{font-size:1.35rem;color:#111827;font-weight:750;margin-top:3px}.controls{display:flex;flex-wrap:wrap;gap:8px}.controls button{border:1px solid #dbe2ea;background:#fff;border-radius:999px;padding:8px 12px;color:#374151;cursor:pointer;font-weight:600}.controls button.active{background:#1d4ed8;color:#fff;border-color:#1d4ed8}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,.8fr);gap:16px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden}.map-wrap{position:relative}.map{height:570px}.legend{position:absolute;z-index:500;left:14px;bottom:14px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;box-shadow:0 3px 12px rgba(15,23,42,.08);font-size:.8rem}.gradient{width:150px;height:10px;border-radius:4px;background:linear-gradient(90deg,#e0f2fe,#60a5fa,#1d4ed8);margin:6px 0}.detail{padding:20px;min-height:570px}.detail h2{margin:0 0 4px;color:#111827}.rank{color:#64748b;font-size:.9rem;margin-bottom:18px}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{border:1px solid #e5e7eb;border-radius:10px;padding:12px}.metric span{display:block;font-size:.75rem;color:#64748b;text-transform:uppercase;letter-spacing:.04em}.metric strong{display:block;font-size:1.15rem;color:#111827;margin-top:3px}.note{font-size:.82rem;color:#64748b;line-height:1.5;margin-top:18px}.table-wrap{margin-top:16px;padding:18px}.table-title{font-weight:750;color:#111827;margin-bottom:8px}.table{width:100%;border-collapse:collapse;font-size:.86rem}.table th,.table td{padding:9px 6px;border-bottom:1px solid #eef2f7;text-align:left}.table th{color:#64748b;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}.table button{border:0;background:none;color:#1d4ed8;font-weight:700;cursor:pointer;padding:0}.empty{color:#64748b;padding:30px 0}.leaflet-container{font:inherit}.zip-label{background:rgba(255,255,255,.9);border:0;box-shadow:none;color:#334155;font-weight:700;font-size:11px;padding:2px 4px}.leaflet-tooltip.zip-label:before{display:none}@media(max-width:800px){.top{display:block}.controls{margin-top:12px}.layout{grid-template-columns:1fr}.map{height:520px}.detail{min-height:0}}
</style></head><body>
<div class="wrap"><div class="top"><div><div class="eyebrow">Interactive analysis</div><div class="title">Explore the Opportunity Index</div></div><div class="controls" id="controls"></div></div>
<div class="layout"><div class="panel map-wrap"><div id="map" class="map"></div><div class="legend"><div id="legendTitle">Opportunity Index</div><div class="gradient"></div><div style="display:flex;justify-content:space-between"><span id="legendMin">Low</span><span id="legendMax">High</span></div></div></div><div class="panel detail" id="detail"><div class="empty">Select a ZIP code on the map or in the table to inspect the score.</div></div></div>
<div class="panel table-wrap"><div class="table-title">Ranked ZIP codes</div><table class="table"><thead><tr><th>Rank</th><th>ZIP</th><th>Opportunity</th><th>Demand</th><th>PCPs / 1,000</th><th>Scarcity</th></tr></thead><tbody id="rankBody"></tbody></table></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script src="hospital-expansion-data.js"></script>
<script>
const DATA=window.HOSPITAL_EXPANSION_DATA.records; const GEO=window.HOSPITAL_EXPANSION_DATA.geojson; let metric='opportunity_index'; let selected=null;
const labels={opportunity_index:'Opportunity Index',final_demand_score:'Final Demand Score',pcp_per_1000:'PCPs per 1,000',supply_scarcity_score:'Supply Scarcity'};
const metricFormat={opportunity_index:v=>v.toFixed(3),final_demand_score:v=>v.toFixed(3),pcp_per_1000:v=>v.toFixed(2),supply_scarcity_score:v=>v.toFixed(3)};
const byZip=Object.fromEntries(DATA.map(d=>[d.zip,d])); const map=L.map('map',{scrollWheelZoom:false}).setView([28.68,-81.25],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
let layer;
function color(v,min,max){const t=(v-min)/(max-min||1); const a=[224,242,254], b=[29,78,216]; return 'rgb('+a.map((x,i)=>Math.round(x+(b[i]-x)*t)).join(',')+')'}
function draw(){const vals=DATA.map(d=>d[metric]), min=Math.min(...vals), max=Math.max(...vals); document.getElementById('legendTitle').textContent=labels[metric]; document.getElementById('legendMin').textContent=metricFormat[metric](min); document.getElementById('legendMax').textContent=metricFormat[metric](max); if(layer) layer.remove(); layer=L.geoJSON(GEO,{style:f=>({fillColor:color(byZip[f.properties.zip][metric],min,max),weight:1.5,color:'#fff',fillOpacity:.82}),onEachFeature:(f,l)=>{const z=f.properties.zip; l.bindTooltip(z,{permanent:true,direction:'center',className:'zip-label'}); l.on('click',()=>selectZip(z,'map')); l.on('mouseover',()=>l.setStyle({weight:3,color:'#111827'})); l.on('mouseout',()=>l.setStyle({weight:1.5,color:'#fff'}));}}).addTo(map); map.fitBounds(layer.getBounds(),{padding:[12,12]}); renderTable(); if(selected) selectZip(selected,'refresh');}
function selectZip(zip,source){selected=zip; const d=byZip[zip]; document.getElementById('detail').innerHTML='<div class="eyebrow">ZIP '+d.zip+'</div><h2>#'+d.rank+' in Opportunity Index</h2><div class="rank">Opportunity Index: <strong>'+d.opportunity_index.toFixed(3)+'</strong></div><div class="metric-grid"><div class="metric"><span>Final demand</span><strong>'+d.final_demand_score.toFixed(3)+'</strong></div><div class="metric"><span>Supply scarcity</span><strong>'+d.supply_scarcity_score.toFixed(3)+'</strong></div><div class="metric"><span>PCPs</span><strong>'+d.pcp_count+'</strong></div><div class="metric"><span>PCPs / 1,000</span><strong>'+d.pcp_per_1000.toFixed(2)+'</strong></div><div class="metric"><span>Clinical need</span><strong>'+d.clinical_need_score.toFixed(2)+'</strong></div><div class="metric"><span>Weighted age</span><strong>'+Math.round(d.weighted_age_score).toLocaleString()+'</strong></div></div><div class="note">The Opportunity Index combines final demand (70%) with supply scarcity (30%). It is a screening model for further evaluation—not a standalone site-selection or investment decision.</div>'; if(source!=='refresh') window.parent.postMessage({type:'hospital_expansion_event',event:'hospital_expansion_zip_selected',params:{zip,source,rank:d.rank}},'*');}
function renderTable(){document.getElementById('rankBody').innerHTML=DATA.map(d=>'<tr><td>'+d.rank+'</td><td><button onclick="selectZip(\''+d.zip+'\',\'table\')">'+d.zip+'</button></td><td>'+d.opportunity_index.toFixed(3)+'</td><td>'+d.final_demand_score.toFixed(3)+'</td><td>'+d.pcp_per_1000.toFixed(2)+'</td><td>'+d.supply_scarcity_score.toFixed(3)+'</td></tr>').join('');}
const controls=document.getElementById('controls'); Object.entries(labels).forEach(([key,label])=>{const b=document.createElement('button'); b.textContent=label; b.dataset.metric=key; b.onclick=()=>{metric=key; document.querySelectorAll('.controls button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); draw(); window.parent.postMessage({type:'hospital_expansion_event',event:'hospital_expansion_metric_changed',params:{metric:key}},'*')}; controls.appendChild(b);}); controls.firstChild.classList.add('active'); draw(); window.parent.postMessage({type:'hospital_expansion_event',event:'hospital_expansion_explorer_opened',params:{}},'*');
</script></body></html>
